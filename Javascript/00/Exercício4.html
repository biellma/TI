<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4</title>
</head>
<body>
    <script>
        let peso = Number.parseInt(window.prompt("Digite o peso:"));
        let altura = Number.parseInt(window.prompt("Digite a altura:"));
        let imc = peso / (altura / 100) ** 2;
        window.alert(`Seu IMC é: ${imc}`);

    </script>
</body>
</html>
